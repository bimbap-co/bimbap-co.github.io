<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sayed &amp; Shamira Wedding · #SAHdenganIra</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <link rel="alternate icon" type="image/x-icon" href="./favicon.ico">
  <link rel="stylesheet" href="./style.css?v=1794311559">
  <script>
    (function() {
      try {
        var saved = localStorage.getItem("soyarin_theme") || "system";
        var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
        var activeTheme = (saved === "dark" || (saved === "system" && prefersDark)) ? "dark" : "light";
        document.documentElement.setAttribute("data-theme", activeTheme);
        document.documentElement.setAttribute("data-theme-preference", saved);
      } catch (e) {}
    })();
  </script>
  <script src="./app.js?v=1794311559" defer></script>
</head>
<body class="guest-mode">
  <!-- Sovereign Top Header (Clean: Monogram, Names, Hashtag, Year) -->
  <header class="masthead guest-masthead">
    <div class="masthead-inner">
      <div class="brand-group">
        <a class="monogram-seal" href="#guest" title="S&amp;S 2026–2027">
          <span>S&amp;S</span>
        </a>
        <div class="brand-text">
          <div class="brand-title-row">
            <h1 class="brand-names">Sayed X Shamira Wedding</h1>
            <span class="hashtag-badge">#SAHdenganIra</span>
            <span class="year-badge">2026 – 2027</span>
          </div>
          <div class="brand-subline">
            <span><strong>Groom:</strong> Sayed Arif Hakimi (Sayed)</span>
            <span class="subline-dot">·</span>
            <span><strong>Bride:</strong> Nor Shamira Irwani (Shamira)</span>
          </div>
        </div>
      </div>
      <div class="header-right-group guest-header-right">
        <div class="header-shortcuts">
          <div class="theme-dropdown-wrap">
            <button type="button" class="shortcut-icon-btn theme-toggle-btn" id="btn-theme-toggle" data-prompt="Theme mode (Click to switch)" title="Switch Theme (Light / Dark / Auto)" aria-label="Switch Theme" aria-haspopup="true" aria-expanded="false">
              <span class="theme-current-icon">🌓</span>
            </button>
            <div class="theme-dropdown-menu" id="theme-dropdown-menu" role="menu" aria-label="Theme mode switcher">
              <button type="button" class="theme-menu-item" data-theme-val="light" role="menuitem">
                <span class="theme-menu-icon">☀️</span>
                <span class="theme-menu-label">Light</span>
                <span class="theme-menu-check">✓</span>
              </button>
              <button type="button" class="theme-menu-item" data-theme-val="dark" role="menuitem">
                <span class="theme-menu-icon">🌙</span>
                <span class="theme-menu-label">Dark</span>
                <span class="theme-menu-check">✓</span>
              </button>
              <button type="button" class="theme-menu-item" data-theme-val="system" role="menuitem">
                <span class="theme-menu-icon">💻</span>
                <span class="theme-menu-label">Auto</span>
                <span class="theme-menu-check">✓</span>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- Horizontal Navigation Tabs -->
  <nav class="tabs-bar" aria-label="Wedding Views" id="nav"></nav>

  <!-- Main View Container -->
  <main class="page-container">
    <section id="content" aria-labelledby="page-title"></section>
    <footer class="site-footer">
      <div class="footer-inner">
        <span>Sayed &amp; Shamira · <strong>#SAHdenganIra</strong></span>
        <div class="footer-theme-wrap">
          <div class="theme-switcher-group" role="group" aria-label="Theme mode switcher">
            <button type="button" class="theme-switcher-btn" data-theme-val="light" title="Light theme" aria-label="Light mode">
              <span class="theme-icon">☀️</span>
              <span class="theme-label">Light</span>
            </button>
            <button type="button" class="theme-switcher-btn" data-theme-val="dark" title="Dark theme" aria-label="Dark mode">
              <span class="theme-icon">🌙</span>
              <span class="theme-label">Dark</span>
            </button>
            <button type="button" class="theme-switcher-btn" data-theme-val="system" title="Follow system theme" aria-label="System mode">
              <span class="theme-icon">💻</span>
              <span class="theme-label">Auto</span>
            </button>
          </div>
        </div>
        <span>Official Wedding Portal · 2026–2027</span>
      </div>
    </footer>
  </main>

  <!-- Detail Modal Dialog for Viewing Programme Posters -->
  <dialog id="detail-modal" class="detail-dialog">
    <div class="dialog-header">
      <div id="detail-modal-title" class="dialog-title-luxury">Official Programme Poster</div>
      <button id="close-detail-modal" type="button" class="dialog-close-btn" aria-label="Close details">×</button>
    </div>
    <div id="detail-modal-body" class="detail-modal-body"></div>
  </dialog>
</body>
</html>
