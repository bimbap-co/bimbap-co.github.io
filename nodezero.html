    function hexToBytes(hex) {
      const bytes = new Uint8Array(hex.length / 2);
      for (let i = 0; i < hex.length; i += 2) {
        bytes[i / 2] = parseInt(hex.substr(i, 2), 16);
      }
      return bytes;
    }

    async function deriveKey(passcode, saltBytes) {
      const enc = new TextEncoder();
      const keyMaterial = await crypto.subtle.importKey(
        "raw",
        enc.encode(passcode),
        { name: "PBKDF2" },
        false,
        ["deriveKey"]
      );
      return await crypto.subtle.deriveKey(
        {
          name: "PBKDF2",
          salt: saltBytes,
          iterations: 100000,
          hash: "SHA-256"
        },
        keyMaterial,
        { name: "AES-GCM", length: 256 },
        false,
        ["decrypt"]
      );
    }

    async function decryptVault(passcode) {
      const salt = hexToBytes(VAULT.salt);
      const iv = hexToBytes(VAULT.iv);
      const ct = hexToBytes(VAULT.ct);

      const key = await deriveKey(passcode, salt);
      const pt = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: iv },
        key,
        ct
      );
      const dec = new TextDecoder();
      return JSON.parse(dec.decode(pt));
    }

    async function handleUnlock(e) {
      if (e) e.preventDefault();
      const input = document.getElementById('passcodeInput');
      const error = document.getElementById('authError');
      const btn = document.getElementById('unlockBtn');
      const passcode = input.value.trim();

      if (!passcode) return;

      btn.disabled = true;
      btn.innerText = "DECRYPTING...";
      error.classList.add('hidden');

      try {
        const payload = await decryptVault(passcode);
        sessionStorage.setItem('wth_vault_token', passcode);
        mountWTH(payload);
      } catch (err) {
        error.classList.remove('hidden');
        btn.disabled = false;
        btn.innerText = "Decrypt & Access Graph";
      }
    }

    function mountWTH(payload) {
      document.getElementById('authGate').classList.add('hidden');
      const container = document.getElementById('unlockedApp');
      container.classList.remove('hidden');
      container.innerHTML = payload.html;

      const scriptEl = document.createElement('script');
      scriptEl.textContent = payload.js;
      document.body.appendChild(scriptEl);
    }

    function lockWTH() {
      sessionStorage.removeItem('wth_vault_token');
      location.reload();
    }

    // Auto-restore session from sessionStorage
    window.addEventListener('DOMContentLoaded', async () => {
      const savedPass = sessionStorage.getItem('wth_vault_token');
      if (savedPass) {
        try {
          const payload = await decryptVault(savedPass);
          mountWTH(payload);
        } catch (e) {
          sessionStorage.removeItem('wth_vault_token');
        }
      }
    });
